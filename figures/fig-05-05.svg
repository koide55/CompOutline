aseline="middle" class="t-s b">D</text><rect x="500" y="172" width="74" height="34" class="accT s"/><text x="537.0" y="189.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">E</text><rect x="574" y="172" width="74" height="34" class="tint s"/><text x="611.0" y="189.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">M</text><rect x="648" y="172" width="74" height="34" class="tint s"/><text x="685.0" y="189.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">W</text><text x="116" y="223.0" text-anchor="end" dominant-baseline="middle" class="t-s">命令 I5</text><rect x="426" y="206" width="74" height="34" class="tint s"/><text x="463.0" y="223.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">F</text><rect x="500" y="206" width="74" height="34" class="tint s"/><text x="537.0" y="223.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">D</text><rect x="574" y="206" width="74" height="34" class="accT s"/><text x="611.0" y="223.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">E</text><rect x="648" y="206" width="74" height="34" class="tint s"/><text x="685.0" y="223.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">M</text><rect x="722" y="206" width="74" height="34" class="tint s"/><text x="759.0" y="223.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">W</text><line x1="426" y1="64" x2="426" y2="250" class="sm dash"/><text x="426" y="266" text-anchor="middle" dominant-baseline="middle" class="t-s b">ここから毎サイクル1命令が完了する</text><text x="426" y="288" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">F フェッチ　D デコード　E 実行　M メモリ　W 書き戻し</text><text x="430" y="318" text-anchor="middle" dominant-baseline="middle" class="t-s b">1命令の所要時間は変わらないが、単位時間あたりの完了数が5倍になる</text></svg>
