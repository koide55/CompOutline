<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="700" height="450" class="bg"/><text x="40" y="40" text-anchor="start" dominant-baseline="middle" class="b">(1)</text><rect x="190" y="52" width="130" height="56" rx="6" class="tint s"/><text x="255" y="80" text-anchor="middle" dominant-baseline="middle" class="t-s b">スイッチ</text><circle cx="120" cy="40" r="16" class="bg s"/><text x="120" y="40" text-anchor="middle" dominant-baseline="middle" class="t-s">A</text><line x1="136" y1="40" x2="190" y2="66" class="sm"/><circle cx="120" cy="120" r="16" class="bg s"/><text x="120" y="120" text-anchor="middle" dominant-baseline="middle" class="t-s">B</text><line x1="136" y1="120" x2="190" y2="94" class="sm"/><circle cx="390" cy="40" r="16" class="bg s"/><text x="390" y="40" text-anchor="middle" dominant-baseline="middle" class="t-s">C</text><line x1="374" y1="40" x2="320" y2="66" class="sm"/><circle cx="390" cy="120" r="16" class="bg s"/><text x="390" y="120" text-anchor="middle" dominant-baseline="middle" class="t-s">D</text><line x1="374" y1="120" x2="320" y2="94" class="sm"/><line x1="136" y1="44" x2="186" y2="64" class="sa" marker-end="url(#a)"/><line x1="324" y1="66" x2="374" y2="46" class="sm" marker-end="url(#a)"/><line x1="324" y1="94" x2="374" y2="114" class="sm" marker-end="url(#a)"/><line x1="186" y1="94" x2="138" y2="114" class="sm" marker-end="url(#a)"/><text x="60" y="148" text-anchor="start" dominant-baseline="middle" class="t-xs">B の位置を知らないので、受信ポート以外の全ポートへ（フラッディング）</text><rect x="500" y="44" width="160" height="42" rx="4" class="none sm"/><text x="580" y="58" text-anchor="middle" dominant-baseline="middle" class="t-xs b">MAC アドレステーブル</text><text x="580" y="76" text-anchor="middle" dominant-baseline="middle" class="t-xs m">A → ポート1</text><text x="40" y="170" text-anchor="start" dominant-baseline="middle" class="b">(2)</text><rect x="190" y="182" width="130" height="56" rx="6" class="tint s"/><text x="255" y="210" text-anchor="middle" dominant-baseline="middle" class="t-s b">スイッチ</text><circle cx="120" cy="170" r="16" class="bg s"/><text x="120" y="170" text-anchor="middle" dominant-baseline="middle" class="t-s">A</text><line x1="136" y1="170" x2="190" y2="196" class="sm"/><circle cx="120" cy="250" r="16" class="bg s"/><text x="120" y="250" text-anchor="middle" dominant-baseline="middle" class="t-s">B</text><line x1="136" y1="250" x2="190" y2="224" class="sm"/><circle cx="390" cy="170" r="16" class="bg s"/><text x="390" y="170" text-anchor="middle" dominant-baseline="middle" class="t-s">C</text><line x1="374" y1="170" x2="320" y2="196" class="sm"/><circle cx="390" cy="250" r="16" class="bg s"/><text x="390" y="250" text-anchor="middle" dominant-baseline="middle" class="t-s">D</text><line x1="374" y1="250" x2="320" y2="224" class="sm"/><line x1="136" y1="246" x2="186" y2="224" class="sa" marker-end="url(#a)"/><line x1="186" y1="196" x2="138" y2="176" class="sa" marker-end="url(#a)"/><text x="60" y="278" text-anchor="start" dominant-baseline="middle" class="t-xs">表を見て、ポート1にだけ転送する</text><rect x="500" y="174" width="160" height="60" rx="4" class="none sm"/><text x="580" y="188" text-anchor="middle" dominant-baseline="middle" class="t-xs b">MAC アドレステーブル</text><text x="580" y="206" text-anchor="middle" dominant-baseline="middle" class="t-xs m">A → ポート1</text><text x="580" y="224" text-anchor="middle" dominant-baseline="middle" class="t-xs m">B → ポート2</text><text x="40" y="300" text-anchor="start" dominant-baseline="middle" class="b">(3)</text><rect x="190" y="312" width="130" height="56" rx="6" class="tint s"/><text x="255" y="340" text-anchor="middle" dominant-baseline="middle" class="t-s b">スイッチ</text><circle cx="120" cy="300" r="16" class="bg s"/><text x="120" y="300" text-anchor="middle" dominant-baseline="middle" class="t-s">A</text><line x1="136" y1="300" x2="190" y2="326" class="sm"/><circle cx="120" cy="380" r="16" class="bg s"/><text x="120" y="380" text-anchor="middle" dominant-baseline="middle" class="t-s">B</text><line x1="136" y1="380" x2="190" y2="354" class="sm"/><circle cx="390" cy="300" r="16" class="bg s"/><text x="390" y="300" text-anchor="middle" dominant-baseline="middle" class="t-s">C</text><line x1="374" y1="300" x2="320" y2="326" class="sm"/><circle cx="390" cy="380" r="16" class="bg s"/><text x="390" y="380" text-anchor="middle" dominant-baseline="middle" class="t-s">D</text><line x1="374" y1="380" x2="320" y2="354" class="sm"/><line x1="136" y1="304" x2="186" y2="324" class="sa" marker-end="url(#a)"/><line x1="186" y1="354" x2="138" y2="374" class="sa" marker-end="url(#a)"/><text x="408" y="340" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">C, D には流れない</text><text x="60" y="408" text-anchor="start" dominant-baseline="middle" class="t-xs">以後 A↔B の通信はポート1と2の間だけで完結する</text><rect x="500" y="304" width="160" height="60" rx="4" class="none sm"/><text x="580" y="318" text-anchor="middle" dominant-baseline="middle" class="t-xs b">MAC アドレステーブル</text><text x="580" y="336" text-anchor="middle" dominant-baseline="middle" class="t-xs m">A → ポート1</text><text x="580" y="354" text-anchor="middle" dominant-baseline="middle" class="t-xs m">B → ポート2</text><text x="350" y="438" text-anchor="middle" dominant-baseline="middle" class="t-s b">送信元 MAC を観察するだけで、転送表が自律的に埋まっていく</text></svg>
