<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="700" height="380" class="bg"/><rect x="40" y="140" width="110" height="60" class="tint s"/><text x="95.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="t-s">ブラウザ</text><text x="95" y="216" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">プレゼンテーション層</text><rect x="40" y="56" width="110" height="44" class="tint2 s"/><text x="95.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="t-s">CDN</text><path d="M95,138 L95,102" class="sm dash" marker-end="url(#am)"/><text x="160" y="78" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">近くから返せるものは</text><text x="160" y="94" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">ここで返す</text><rect x="210" y="140" width="100" height="60" class="tint s"/><text x="260.0" y="162.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ロード</text><text x="260.0" y="178.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">バランサ</text><line x1="150" y1="170" x2="206" y2="170" class="sa" marker-end="url(#a)"/><text x="178.0" y="163.0" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">HTTP</text><rect x="370" y="96" width="130" height="46" class="tint s"/><text x="435.0" y="111.5" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリケーション</text><text x="435.0" y="126.5" text-anchor="middle" dominant-baseline="middle" class="t-xs">サーバ</text><line x1="310" y1="170" x2="366" y2="119" class="sm" marker-end="url(#am)"/><line x1="500" y1="119" x2="556" y2="178" class="sm" marker-end="url(#am)"/><rect x="370" y="158" width="130" height="46" class="tint s"/><text x="435.0" y="173.5" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリケーション</text><text x="435.0" y="188.5" text-anchor="middle" dominant-baseline="middle" class="t-xs">サーバ</text><line x1="310" y1="170" x2="366" y2="181" class="sm" marker-end="url(#am)"/><line x1="500" y1="181" x2="556" y2="178" class="sm" marker-end="url(#am)"/><rect x="370" y="220" width="130" height="46" class="tint s"/><text x="435.0" y="235.5" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリケーション</text><text x="435.0" y="250.5" text-anchor="middle" dominant-baseline="middle" class="t-xs">サーバ</text><line x1="310" y1="170" x2="366" y2="243" class="sm" marker-end="url(#am)"/><line x1="500" y1="243" x2="556" y2="178" class="sm" marker-end="url(#am)"/><text x="435" y="300" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">アプリケーション層</text><rect x="560" y="150" width="110" height="56" class="accT s"/><text x="615.0" y="178.0" text-anchor="middle" dominant-baseline="middle" class="t-s">データベース</text><rect x="560" y="224" width="110" height="40" class="bg s dash"/><text x="615.0" y="244.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">レプリカ</text><line x1="615" y1="206" x2="615" y2="222" class="sm dash"/><text x="615" y="288" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">データ層</text><text x="350" y="336" text-anchor="middle" dominant-baseline="middle" class="t-s b">HTTP がステートレスだから、アプリケーションサーバは何台に増やしてもよい</text><text x="350" y="360" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">ログイン状態などは Cookie やトークンとしてクライアント側に持たせる</text></svg>
