d="url(#a)"/><line x1="400" y1="354" x2="400" y2="318" class="sa" marker-end="url(#a)"/><text x="210" y="274" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">データ</text><text x="500" y="274" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">データ</text><text x="362" y="340" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">データ</text></svg>
