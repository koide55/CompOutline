lass="t-xs lbl">画面</text><line x1="116" y1="293" x2="124" y2="293" class="sm"/><text x="112" y="319" text-anchor="end" dominant-baseline="middle" class="t-xs lbl">画面</text><line x1="116" y1="319" x2="124" y2="319" class="sm"/><rect x="430" y="150" width="130" height="100" rx="8" class="tint2 s"/><text x="495" y="190" text-anchor="middle" dominant-baseline="middle" class="t-s b">パイプ</text><text x="495" y="210" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">（カーネル内）</text><path d="M360,102 L495,102 L495,146" class="sa" marker-end="url(#aa)"/><text x="430" y="92" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">書き口へ</text><path d="M495,254 L495,282 L364,282" class="sa" marker-end="url(#aa)"/><text x="430" y="300" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">読み口から</text><text x="350" y="360" text-anchor="middle" dominant-baseline="middle" class="t-s b">付け替えたのは片側だけ。ls は「1番に書く」、wc は「0番から読む」だけ</text><text x="350" y="384" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">互いの存在を知らない2つのプログラムが、それだけでつながる</text><rect x="596" y="66" width="96" height="268" rx="6" class="none sm dash"/><text x="644" y="86" text-anchor="middle" dominant-baseline="middle" class="t-xs b">シェルの手順</text><rect x="608" y="106" width="72" height="40" rx="3" class="bg s"/><text x="644" y="126" text-anchor="middle" dominant-baseline="middle" class="t-xs m">① pipe</text><line x1="644" y1="146" x2="644" y2="162" class="sm" marker-end="url(#am)"/><rect x="608" y="162" width="72" height="40" rx="3" class="bg s"/><text x="644" y="182" text-anchor="middle" dominant-baseline="middle" class="t-xs m">② fork</text><line x1="644" y1="202" x2="644" y2="218" class="sm" marker-end="url(#am)"/><rect x="608" y="218" width="72" height="40" rx="3" class="bg s"/><text x="644" y="238" text-anchor="middle" dominant-baseline="middle" class="t-xs m">③ dup</text><line x1="644" y1="258" x2="644" y2="274" class="sm" marker-end="url(#am)"/><rect x="608" y="274" width=