<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="700" height="470" class="bg"/><text x="180" y="36" text-anchor="middle" dominant-baseline="middle" class="b">サーバ</text><text x="500" y="36" text-anchor="middle" dominant-baseline="middle" class="b">クライアント</text><rect x="110" y="62" width="140" height="42" class="tint s"/><text x="180.0" y="83.0" text-anchor="middle" dominant-baseline="middle" class="t-s m b">socket</text><rect x="110" y="118" width="140" height="42" class="tint s"/><text x="180.0" y="139.0" text-anchor="middle" dominant-baseline="middle" class="t-s m b">bind</text><rect x="110" y="174" width="140" height="42" class="tint s"/><text x="180.0" y="195.0" text-anchor="middle" dominant-baseline="middle" class="t-s m b">listen</text><rect x="110" y="230" width="140" height="42" class="tint s"/><text x="180.0" y="251.0" text-anchor="middle" dominant-baseline="middle" class="t-s m b">accept</text><rect x="430" y="62" width="140" height="42" class="tint s"/><text x="500.0" y="83.0" text-anchor="middle" dominant-baseline="middle" class="t-s m b">socket</text><rect x="430" y="230" width="140" height="42" class="tint s"/><text x="500.0" y="251.0" text-anchor="middle" dominant-baseline="middle" class="t-s m b">connect</text><line x1="180" y1="104" x2="180" y2="118" class="sm" marker-end="url(#am)"/><line x1="180" y1="160" x2="180" y2="174" class="sm" marker-end="url(#am)"/><line x1="180" y1="216" x2="180" y2="230" class="sm" marker-end="url(#am)"/><line x1="500" y1="104" x2="500" y2="228" class="sm" marker-end="url(#am)"/><text x="578" y="166" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">サーバが待ち受けて</text><text x="578" y="182" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">いれば、いつでも</text><text x="578" y="198" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">接続を要求できる</text><path d="M430,251 L254,251" class="sa" marker-end="url(#aa)"/><text x="342" y="236" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">接続の確立（3ウェイハンドシェイク）</text><rect x="110" y="308" width="140" height="42" class="accT s"/><text x="180.0" y="329.0" text-anchor="middle" dominant-baseline="middle" class="t-s m">read / write</text><rect x="430" y="308" width="140" height="42" class="accT s"/><text x="500.0" y="329.0" text-anchor="middle" dominant-baseline="middle" class="t-s m">write / read</text><line x1="254" y1="320" x2="426" y2="320" class="sa" marker-end="url(#a)"/><line x1="426" y1="340" x2="254" y2="340" class="sa" marker-end="url(#a)"/><text x="342" y="298" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">ファイルと同じ操作でやりとりする</text><line x1="180" y1="272" x2="180" y2="304" class="sm" marker-end="url(#am)"/><line x1="500" y1="272" x2="500" y2="304" class="sm" marker-end="url(#am)"/><rect x="110" y="380" width="140" height="42" class="tint s"/><text x="180.0" y="401.0" text-anchor="middle" dominant-baseline="middle" class="t-s m b">close</text><rect x="430" y="380" width="140" height="42" class="tint s"/><text x="500.0" y="401.0" text-anchor="middle" dominant-baseline="middle" class="t-s m b">close</text><line x1="180" y1="350" x2="180" y2="376" class="sm" marker-end="url(#am)"/><line x1="500" y1="350" x2="500" y2="376" class="sm" marker-end="url(#am)"/><rect x="268" y="62" width="144" height="118" rx="6" class="none sm dash"/><text x="340" y="82" text-anchor="middle" dominant-baseline="middle" class="t-xs b">accept は</text><text x="340" y="104" text-anchor="middle" dominant-baseline="middle" class="t-xs">新しいソケットを返す。</text><text x="340" y="119" text-anchor="middle" dominant-baseline="middle" class="t-xs">元のソケットは受付</text><text x="340" y="134" text-anchor="middle" dominant-baseline="middle" class="t-xs">専用として残るので、</text><text x="340" y="149" text-anchor="middle" dominant-baseline="middle" class="t-xs">次の接続を待ち続け</text><text x="340" y="164" text-anchor="middle" dominant-baseline="middle" class="t-xs">られる</text><path d="M300,184 L268,224" class="sm" marker-end="url(#am)"/><text x="342" y="444" text-anchor="middle" dominant-baseline="middle" class="t-s b">接続してしまえば、あとはファイルと同じ read / write で済む</text><text x="342" y="464" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">相手がファイルかパイプか地球の裏側かを、プログラムは意識しなくてよい</text></svg>
