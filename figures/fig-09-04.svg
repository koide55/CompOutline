<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="700" height="380" class="bg"/><line x1="200" y1="70" x2="350" y2="60" class="s2"/><line x1="200" y1="70" x2="500" y2="70" class="s2"/><line x1="350" y1="60" x2="500" y2="70" class="s2"/><circle cx="200" cy="70" r="26" class="accT s"/><text x="200" y="70" text-anchor="middle" dominant-baseline="middle" class="t-xs b">Tier 1</text><circle cx="350" cy="60" r="26" class="accT s"/><text x="350" y="60" text-anchor="middle" dominant-baseline="middle" class="t-xs b">Tier 1</text><circle cx="500" cy="70" r="26" class="accT s"/><text x="500" y="70" text-anchor="middle" dominant-baseline="middle" class="t-xs b">Tier 1</text><text x="600" y="62" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">ピアリング</text><text x="600" y="78" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">（対等・無料）</text><circle cx="140" cy="180" r="24" class="tint s"/><text x="140" y="180" text-anchor="middle" dominant-baseline="middle" class="t-xs">地域ISP</text><circle cx="300" cy="180" r="24" class="tint s"/><text x="300" y="180" text-anchor="middle" dominant-baseline="middle" class="t-xs">地域ISP</text><circle cx="460" cy="180" r="24" class="tint s"/><text x="460" y="180" text-anchor="middle" dominant-baseline="middle" class="t-xs">地域ISP</text><line x1="140" y1="158" x2="200" y2="94" class="sm"/><line x1="300" y1="158" x2="350" y2="84" class="sm"/><line x1="460" y1="158" x2="500" y2="94" class="sm"/><line x1="140" y1="158" x2="350" y2="84" class="sm"/><line x1="460" y1="158" x2="350" y2="84" class="sm"/><rect x="500" y="156" width="130" height="48" rx="6" class="tint2 s"/><text x="565" y="172" text-anchor="middle" dominant-baseline="middle" class="b">IX</text><text x="565" y="190" text-anchor="middle" dominant-baseline="middle" class="t-xs">（相互接続点）</text><line x1="322" y1="180" x2="498" y2="180" class="sm"/><line x1="482" y1="180" x2="498" y2="180" class="sm"/><line x1="565" y1="154" x2="500" y2="92" class="sm"/><circle cx="90" cy="268" r="20" class="bg s"/><text x="90" y="268" text-anchor="middle" dominant-baseline="middle" class="t-xs">ISP</text><circle cx="200" cy="268" r="20" class="bg s"/><text x="200" y="268" text-anchor="middle" dominant-baseline="middle" class="t-xs">ISP</text><circle cx="320" cy="268" r="20" class="bg s"/><text x="320" y="268" text-anchor="middle" dominant-baseline="middle" class="t-xs">ISP</text><circle cx="440" cy="268" r="20" class="bg s"/><text x="440" y="268" text-anchor="middle" dominant-baseline="middle" class="t-xs">ISP</text><line x1="90" y1="250" x2="140" y2="202" class="sm"/><rect x="46" y="316" width="88" height="32" class="tint s"/><text x="90.0" y="332.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">大学</text><line x1="90" y1="288" x2="90" y2="314" class="sm"/><line x1="200" y1="250" x2="140" y2="202" class="sm"/><rect x="156" y="316" width="88" height="32" class="tint s"/><text x="200.0" y="332.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">企業</text><line x1="200" y1="288" x2="200" y2="314" class="sm"/><line x1="320" y1="250" x2="300" y2="202" class="sm"/><rect x="276" y="316" width="88" height="32" class="tint s"/><text x="320.0" y="332.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">家庭</text><line x1="320" y1="288" x2="320" y2="314" class="sm"/><line x1="440" y1="250" x2="300" y2="202" class="sm"/><rect x="396" y="316" width="88" height="32" class="tint s"/><text x="440.0" y="332.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">家庭</text><line x1="440" y1="288" x2="440" y2="314" class="sm"/><text x="600" y="268" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">トランジット</text><text x="600" y="284" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">（費用を払って</text><text x="600" y="300" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">  到達性を買う）</text><text x="350" y="372" text-anchor="middle" dominant-baseline="middle" class="t-s b">中央の管理者はいない。独立した多数の AS が相互接続している</text></svg>
