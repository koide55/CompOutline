<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="700" height="430" class="bg"/><text x="350" y="34" text-anchor="middle" dominant-baseline="middle" class="b">署名する側</text><rect x="40" y="56" width="110" height="44" class="bg s"/><text x="95.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="t-s">文書</text><rect x="220" y="56" width="120" height="44" class="tint s"/><text x="280.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ハッシュ関数</text><rect x="400" y="56" width="110" height="44" class="tint2 s"/><text x="455.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ハッシュ値</text><rect x="570" y="56" width="90" height="44" class="accT s"/><text x="615.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="t-s">署名</text><line x1="150" y1="78" x2="216" y2="78" class="sm" marker-end="url(#am)"/><line x1="340" y1="78" x2="396" y2="78" class="sm" marker-end="url(#am)"/><line x1="510" y1="78" x2="566" y2="78" class="sa" marker-end="url(#a)"/><text x="538.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">秘密鍵</text><line x1="40" y1="136" x2="660" y2="136" class="sm dot"/><text x="350" y="166" text-anchor="middle" dominant-baseline="middle" class="b">検証する側</text><rect x="40" y="190" width="110" height="44" class="bg s"/><text x="95.0" y="212.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">受け取った文書</text><rect x="220" y="190" width="120" height="44" class="tint s"/><text x="280.0" y="212.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ハッシュ関数</text><rect x="400" y="190" width="110" height="44" class="tint2 s"/><text x="455.0" y="212.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ハッシュ値 A</text><line x1="150" y1="212" x2="216" y2="212" class="sm" marker-end="url(#am)"/><line x1="340" y1="212" x2="396" y2="212" class="sm" marker-end="url(#am)"/><rect x="40" y="262" width="110" height="44" class="accT s"/><text x="95.0" y="284.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">受け取った署名</text><rect x="400" y="262" width="110" height="44" class="tint2 s"/><text x="455.0" y="284.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ハッシュ値 B</text><line x1="150" y1="284" x2="396" y2="284" class="sa" marker-end="url(#a)"/><text x="273.0" y="276.0" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">公開鍵で処理</text><rect x="560" y="222" width="100" height="62" class="tint s"/><text x="610.0" y="245.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">A と B を</text><text x="610.0" y="261.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">比べる</text><line x1="510" y1="212" x2="556" y2="240" class="sm" marker-end="url(#am)"/><line x1="510" y1="284" x2="556" y2="268" class="sm" marker-end="url(#am)"/><text x="350" y="332" text-anchor="middle" dominant-baseline="middle" class="t-xs b">一致 → 本人が署名し、改竄もされていない</text><text x="350" y="350" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">不一致 → 改竄されたか、偽の署名</text><text x="350" y="386" text-anchor="middle" dominant-baseline="middle" class="t-s b">秘密鍵を持つのは本人だけなので、それを作れたのは本人しかいない</text><text x="350" y="410" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">署名は文書を秘密にしない。秘密にしたければ暗号化も併せて行う</text></svg>
