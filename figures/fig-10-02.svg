<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="660" height="420" class="bg"/><text x="170" y="36" text-anchor="middle" dominant-baseline="middle" class="b">クライアント</text><text x="490" y="36" text-anchor="middle" dominant-baseline="middle" class="b">サーバ</text><line x1="170" y1="50" x2="170" y2="384" class="sm"/><line x1="490" y1="50" x2="490" y2="384" class="sm"/><line x1="170" y1="70" x2="490" y2="92" class="sa" marker-end="url(#a)"/><text x="330" y="74" text-anchor="middle" dominant-baseline="middle" class="t-xs m">SYN  seq=x</text><line x1="490" y1="108" x2="170" y2="130" class="sa" marker-end="url(#a)"/><text x="330" y="112" text-anchor="middle" dominant-baseline="middle" class="t-xs m">SYN+ACK  seq=y, ack=x+1</text><line x1="170" y1="146" x2="490" y2="168" class="sa" marker-end="url(#a)"/><text x="330" y="150" text-anchor="middle" dominant-baseline="middle" class="t-xs m">ACK  ack=y+1</text><path d="M118,66 L112,66 L112,172 L118,172" class="sm"/><text x="102" y="119.0" text-anchor="end" dominant-baseline="middle" class="t-s lbl">確立に1往復</text><rect x="230" y="190" width="200" height="44" rx="4" class="accT s"/><text x="330" y="212" text-anchor="middle" dominant-baseline="middle" class="t-s b">データ転送</text><line x1="170" y1="212" x2="228" y2="212" class="sm dot"/><line x1="432" y1="212" x2="490" y2="212" class="sm dot"/><line x1="170" y1="258" x2="490" y2="274" class="s" marker-end="url(#a)"/><text x="330" y="260" text-anchor="middle" dominant-baseline="middle" class="t-xs m">FIN</text><line x1="490" y1="292" x2="170" y2="308" class="s" marker-end="url(#a)"/><text x="330" y="294" text-anchor="middle" dominant-baseline="middle" class="t-xs m">ACK</text><line x1="490" y1="326" x2="170" y2="342" class="s" marker-end="url(#a)"/><text x="330" y="328" text-anchor="middle" dominant-baseline="middle" class="t-xs m">FIN</text><line x1="170" y1="360" x2="490" y2="376" class="s" marker-end="url(#a)"/><text x="330" y="362" text-anchor="middle" dominant-baseline="middle" class="t-xs m">ACK</text><path d="M118,254 L112,254 L112,380 L118,380" class="sm"/><text x="102" y="317.0" text-anchor="end" dominant-baseline="middle" class="t-s lbl">切断は4ウェイ</text><text x="330" y="400" text-anchor="middle" dominant-baseline="middle" class="t-s b">双方が「自分の開始番号」と「相手の番号を受け取った」を伝える最小の回数</text></svg>
