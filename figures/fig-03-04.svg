<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="600" height="300" class="bg"/><path d="M250,60 Q278.8,84.0 250,108 Q285.2,108 314,84.0 Q285.2,60 250,60 Z" class="bg s"/><circle cx="310" cy="84.0" r="5" class="bg s"/><path d="M250,170 Q278.8,194.0 250,218 Q285.2,218 314,194.0 Q285.2,170 250,170 Z" class="bg s"/><circle cx="310" cy="194.0" r="5" class="bg s"/><text x="240" y="200" text-anchor="end" dominant-baseline="middle" class="t-xs lbl">NOR</text><text x="160" y="74" text-anchor="end" dominant-baseline="middle" class="t-s">S（セット）</text><text x="160" y="214" text-anchor="end" dominant-baseline="middle" class="t-s">R（リセット）</text><line x1="166" y1="74" x2="250" y2="74" class="s"/><line x1="166" y1="214" x2="250" y2="214" class="s"/><line x1="320" y1="84" x2="400" y2="84" class="s"/><text x="412" y="84" text-anchor="start" dominant-baseline="middle" class="b">Q</text><line x1="320" y1="194" x2="400" y2="194" class="s"/><text x="412" y="194" text-anchor="start" dominant-baseline="middle" class="b">¬Q</text><path d="M360,84 L360,140 L230,140 L230,204 L250,204" class="sa"/><path d="M360,194 L360,152 L218,152 L218,94 L250,94" class="sa"/><circle cx="360" cy="84" r="3.5" class="ink"/><circle cx="360" cy="194" r="3.5" class="ink"/><rect x="430" y="40" width="150" height="120" rx="6" class="none sm"/><text x="505" y="58" text-anchor="middle" dominant-baseline="middle" class="t-s b m">S  R   Q</text><text x="448" y="80" text-anchor="start" dominant-baseline="middle" class="t-xs m">1  0   1  にする</text><text x="448" y="100" text-anchor="start" dominant-baseline="middle" class="t-xs m">0  1   0  にする</text><text x="448" y="120" text-anchor="start" dominant-baseline="middle" class="t-xs m">0  0   直前のまま</text><text x="448" y="140" text-anchor="start" dominant-baseline="middle" class="t-xs m">1  1   禁止</text><text x="300" y="268" text-anchor="middle" dominant-baseline="middle" class="t-s b">S=R=0 で直前の値を保つ ＝ 1ビットを記憶している</text></svg>
