<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="700" height="450" class="bg"/><text x="24" y="24" text-anchor="start" dominant-baseline="middle" class="t-s b">① キャッシュに当たるか外れるかで、アクセス時間が桁で違う</text><text x="186" y="54" text-anchor="end" dominant-baseline="middle" class="t-s">当たる（ヒット）</text><rect x="196" y="44" width="6" height="20" class="sa"/><text x="210" y="54" text-anchor="start" dominant-baseline="middle" class="t-xs b">約 1 ns</text><text x="186" y="84" text-anchor="end" dominant-baseline="middle" class="t-s">外れる（ミス）</text><rect x="196" y="74" width="356.0" height="20" class="s"/><text x="560.0" y="84" text-anchor="start" dominant-baseline="middle" class="t-xs b">約 80 ns</text><text x="196" y="124" text-anchor="start" dominant-baseline="middle" class="t-s b acc">この差は測れる。だから「キャッシュにあったか」が分かる</text><text x="24" y="162" text-anchor="start" dominant-baseline="middle" class="t-s b">② 投機実行のあと、array2 を順に読んで時間を測る</text><line x1="96" y1="216" x2="96" y2="352" class="s"/><line x1="96" y1="352" x2="656" y2="352" class="s"/><text x="88" y="220" text-anchor="end" dominant-baseline="middle" class="t-xs lbl">アクセス時間</text><rect x="100.0" y="244" width="26.5" height="108" class="s"/><text x="113.25" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">0</text><rect x="134.5" y="244" width="26.5" height="108" class="s"/><text x="147.75" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">1</text><rect x="169.0" y="244" width="26.5" height="108" class="s"/><text x="182.25" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">2</text><rect x="203.5" y="244" width="26.5" height="108" class="s"/><text x="216.75" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">3</text><rect x="238.0" y="244" width="26.5" height="108" class="s"/><text x="251.25" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">4</text><rect x="272.5" y="244" width="26.5" height="108" class="s"/><text x="285.75" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">5</text><rect x="307.0" y="334" width="26.5" height="18" class="sa"/><text x="320.25" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">6</text><rect x="341.5" y="244" width="26.5" height="108" class="s"/><text x="354.75" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">7</text><rect x="376.0" y="244" width="26.5" height="108" class="s"/><text x="389.25" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">8</text><rect x="410.5" y="244" width="26.5" height="108" class="s"/><text x="423.75" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">9</text><rect x="445.0" y="244" width="26.5" height="108" class="s"/><text x="458.25" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">10</text><rect x="479.5" y="244" width="26.5" height="108" class="s"/><text x="492.75" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">11</text><rect x="514.0" y="244" width="26.5" height="108" class="s"/><text x="527.25" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">12</text><rect x="548.5" y="244" width="26.5" height="108" class="s"/><text x="561.75" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">13</text><rect x="583.0" y="244" width="26.5" height="108" class="s"/><text x="596.25" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">14</text><rect x="617.5" y="244" width="26.5" height="108" class="s"/><text x="630.75" y="367" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">15</text><text x="372" y="386" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">array2 の添字</text><line x1="320.25" y1="226" x2="320.25" y2="326" class="sa dash" marker-end="url(#a)"/><text x="330.25" y="218" text-anchor="start" dominant-baseline="middle" class="t-s b acc">1つだけ速い ＝ この添字が秘密の値</text><text x="350" y="412" text-anchor="middle" dominant-baseline="middle" class="t-s b">取り消された実行でも、キャッシュに載せた痕跡は残る</text><text x="350" y="434" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">計算の結果ではなく、副作用から情報を取る —— サイドチャネル攻撃</text></svg>
