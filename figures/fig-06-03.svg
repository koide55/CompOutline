6" text-anchor="middle" dominant-baseline="middle" class="t-s b">A3</text><rect x="526" y="254" width="64" height="44" class="accT s"/><ellipse cx="558.0" cy="298" rx="32.0" ry="7" class="accT s"/><ellipse cx="558.0" cy="254" rx="32.0" ry="7" class="accT s"/><text x="558" y="276" text-anchor="middle" dominant-baseline="middle" class="t-s b">Ap</text><text x="624" y="276" text-anchor="start" dominant-baseline="middle" class="t-xs acc b">P</text><text x="58" y="376" text-anchor="start" dominant-baseline="middle" class="b">RAID 6</text><text x="58" y="398" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">パリティ2種類。2台の故障に耐える</text><rect x="250" y="354" width="64" height="44" class="tint s"/><ellipse cx="282.0" cy="398" rx="32.0" ry="7" class="tint s"/><ellipse cx="282.0" cy="354" rx="32.0" ry="7" class="tint s"/><text x="282" y="376" text-anchor="middle" dominant-baseline="middle" class="t-s b">A1</text><rect x="342" y="354" width="64" height="44" class="tint s"/><ellipse cx="374.0" cy="398" rx="32.0" ry="7" class="tint s"/><ellipse cx="374.0" cy="354" rx="32.0" ry="7" class="tint s"/><text x="374" y="376" text-anchor="middle" dominant-baseline="middle" class="t-s b">A2</text><rect x="434" y="354" width="64" height="44" class="accT s"/><ellipse cx="466.0" cy="398" rx="32.0" ry="7" class="accT s"/><ellipse cx="466.0" cy="354" rx="32.0" ry="7" class="accT s"/><text x="466" y="376" text-anchor="middle" dominant-baseline="middle" class="t-s b">Ap</text><rect x="526" y="354" width="64" height="44" class="accT s"/><ellipse cx="558.0" cy="398" rx="32.0" ry="7" class="accT s"/><ellipse cx="558.0" cy="354" rx="32.0" ry="7" class="accT s"/><text x="558" y="376" text-anchor="middle" dominant-baseline="middle" class="t-s b">Aq</text><text x="624" y="376" text-anchor="start" dominant-baseline="middle" class="t-xs acc b">P</text><text x="350" y="436" text-anchor="middle" dominant-baseline="middle" class="t-s b">パリティは XOR。 A ⊕ P ⊕ C = B のように、残りから復元できる</text></svg>
