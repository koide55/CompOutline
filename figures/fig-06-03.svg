 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="700" height="460" class="bg"/><text x="58" y="76" text-anchor="start" dominant-baseline="middle" class="b">RAID 0</text><text x="58" y="98" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">冗長性なし。1台でも壊れると全滅</text><rect x="250" y="54" width="64" height="44" class="tint s"/><ellipse cx="282.0" cy="98" rx="32.0" ry="7" class="tint s"/><ellipse cx="282.0" cy="54" rx="32.0" ry="7" class="tint s"/><text x="282" y="76" text-anchor="middle" dominant-baseline="middle" class="t-s b">A1</text><text x="282" y="38" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">ディスク1</text><rect x="342" y="54" width="64" height="44" class="tint s"/><ellipse cx="374.0" cy="98" rx="32.0" ry="7" class="tint s"/><ellipse cx="374.0" cy="54" rx="32.0" ry="7" class="tint s"/><text x="374" y="76" text-anchor="middle" dominant-baseline="middle" class="t-s b">A2</text><text x="374" y="38" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">ディスク2</text><rect x="434" y="54" width="64" height="44" class="tint s"/><ellipse cx="466.0" cy="98" rx="32.0" ry="7" class="tint s"/><ellipse cx="466.0" cy="54" rx="32.0" ry="7" class="tint s"/><text x="466" y="76" text-anchor="middle" dominant-baseline="middle" class="t-s b">A3</text><text x="466" y="38" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">ディスク3</text><rect x="526" y="54" width="64" height="44" class="tint s"/><ellipse cx="558.0" cy="98" rx="32.0" ry="7" class="tint s"/><ellipse cx="558.0" cy="54" rx="32.0" ry="7" class="tint s"/><text x="558" y="76" text-anchor="middle" dominant-baseline="middle" class="t-s b">A4</text><text x="558" y="38" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">ディスク4</text><text x="58" y="176" text-anchor="start" dominant-baseline="middle" class="b">RAID 1</text><text x="58" y="198" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">同じものを2台に。容量効率 50%</text><rect x="250" y="154" width="64" height="44" class="tint s"/><ellipse cx