<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="700" height="380" class="bg"/><text x="180" y="32" text-anchor="middle" dominant-baseline="middle" class="b">仮想機械</text><rect x="40" y="300" width="280" height="40" class="tint2 s"/><text x="180.0" y="320.0" text-anchor="middle" dominant-baseline="middle" class="t-s">ハードウェア</text><rect x="40" y="256" width="280" height="40" class="tint s"/><text x="180.0" y="276.0" text-anchor="middle" dominant-baseline="middle" class="t-s">ハイパーバイザ</text><rect x="40" y="128" width="88" height="128" class="none s"/><rect x="44" y="132" width="80" height="34" class="accT s"/><text x="84.0" y="149.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリ</text><rect x="44" y="170" width="80" height="34" class="tint s"/><text x="84.0" y="187.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ライブラリ</text><rect x="44" y="208" width="80" height="40" class="tint2 s"/><text x="84.0" y="228.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ゲスト OS</text><rect x="134" y="128" width="88" height="128" class="none s"/><rect x="138" y="132" width="80" height="34" class="accT s"/><text x="178.0" y="149.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリ</text><rect x="138" y="170" width="80" height="34" class="tint s"/><text x="178.0" y="187.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ライブラリ</text><rect x="138" y="208" width="80" height="40" class="tint2 s"/><text x="178.0" y="228.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ゲスト OS</text><rect x="228" y="128" width="88" height="128" class="none s"/><rect x="232" y="132" width="80" height="34" class="accT s"/><text x="272.0" y="149.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリ</text><rect x="232" y="170" width="80" height="34" class="tint s"/><text x="272.0" y="187.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ライブラリ</text><rect x="232" y="208" width="80" height="40" class="tint2 s"/><text x="272.0" y="228.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ゲスト OS</text><text x="180" y="108" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">カーネルが3つ動く</text><text x="180" y="358" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">起動に数十秒、メモリは GB 単位。分離は強い</text><text x="520" y="32" text-anchor="middle" dominant-baseline="middle" class="b">コンテナ</text><rect x="380" y="300" width="280" height="40" class="tint2 s"/><text x="520.0" y="320.0" text-anchor="middle" dominant-baseline="middle" class="t-s">ハードウェア</text><rect x="380" y="256" width="280" height="40" class="tint s"/><text x="520.0" y="276.0" text-anchor="middle" dominant-baseline="middle" class="t-s">ホスト OS（カーネルは1つ）</text><rect x="380" y="212" width="280" height="34" class="tint2 s"/><text x="520.0" y="229.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">コンテナランタイム</text><rect x="380" y="98" width="88" height="80" class="none s"/><rect x="384" y="102" width="80" height="34" class="accT s"/><text x="424.0" y="119.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリ</text><rect x="384" y="140" width="80" height="34" class="tint s"/><text x="424.0" y="157.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ライブラリ</text><rect x="474" y="98" width="88" height="80" class="none s"/><rect x="478" y="102" width="80" height="34" class="accT s"/><text x="518.0" y="119.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリ</text><rect x="478" y="140" width="80" height="34" class="tint s"/><text x="518.0" y="157.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ライブラリ</text><rect x="568" y="98" width="88" height="80" class="none s"/><rect x="572" y="102" width="80" height="34" class="accT s"/><text x="612.0" y="119.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">アプリ</text><rect x="572" y="140" width="80" height="34" class="tint s"/><text x="612.0" y="157.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ライブラリ</text><text x="520" y="78" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">ゲスト OS の層がない</text><text x="520" y="358" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">起動は1秒未満、メモリは MB 単位。分離は中程度</text></svg>
