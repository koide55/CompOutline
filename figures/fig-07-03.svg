<rect width="700" height="380" class="bg"/><text x="180" y="32" text-anchor="middle" dominant-baseline="middle" class="b">3つのプロセス</text><rect x="40" y="52" width="92" height="250" class="none s"/><rect x="40" y="52" width="92" height="44" class="tint2 s"/><text x="86" y="74.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">スタック</text><rect x="40" y="96" width="92" height="60" class="bg s"/><text x="86" y="126.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">（空き）</text><rect x="40" y="156" width="92" height="46" class="tint2 s"/><text x="86" y="179.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ヒープ</text><rect x="40" y="202" width="92" height="40" class="tint s"/><text x="86" y="222.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">データ</text><rect x="40" y="242" width="92" height="60" class="accT s"/><text x="86" y="272.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">テキスト</text><rect x="148" y="52" width="92" height="250" class="none s"/><rect x="148" y="52" width="92" height="44" class="tint2 s"/><text x="194" y="74.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">スタック</text><rect x="148" y="96" width="92" height="60" class="bg s"/><text x="194" y="126.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">（空き）</text><rect x="148" y="156" width="92" height="46" class="tint2 s"/><text x="194" y="179.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ヒープ</text><rect x="148" y="202" width="92" height="40" class="tint s"/><text x="194" y="222.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">データ</text><rect x="148" y="242" width="92" height="60" class="accT s"/><text x="194" y="272.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">テキスト</text><rect x="256" y="52" width="92" height="250" class="none s"/><rect x="256" y="52" width="92" height="44" class="tint2 s"/><text x="302" y="74.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">スタック</text><rect x="256" y="96" width="92" height="60" class="bg s"/><text x="302" y="126.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">（空き）</text><rect x="256" y="156" width="92" height="46" class="tint2 s"/><text x="302" y="179.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ヒープ</text><rect x="256" y="202" width="92" height="40" class="tint s"/><text x="302" y="222.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">データ</text><rect x="256" y="242" width="92" height="60" class="accT s"/><text x="302" y="272.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">テキスト</text><text x="180" y="322" text-anchor="middle" dominant-baseline="middle" class="t-s">それぞれ独立したアドレス空間</text><text x="180" y="344" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">互いのメモリを見られない</text><text x="520" y="32" text-anchor="middle" dominant-baseline="middle" class="b">1プロセスの中の3スレッド</text><rect x="400" y="52" width="250" height="250" class="none s"/><rect x="412" y="52" width="72" height="44" class="tint2 s"/><text x="448" y="74" text-anchor="middle" dominant-baseline="middle" class="t-xs">スタック1</text><rect x="492" y="52" width="72" height="44" class="tint2 s"/><text x="528" y="74" text-anchor="middle" dominant-baseline="middle" class="t-xs">スタック2</text><rect x="572" y="52" width="72" height="44" class="tint2 s"/><text x="608" y="74" text-anchor="middle" dominant-baseline="middle" class="t-xs">スタック3</text><rect x="400" y="96" width="250" height="60" class="bg s"/><text x="525" y="126" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">（空き）</text><rect x="400" y="156" width="250" height="46" class="tint2 s"/><text x="525" y="179.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ヒープ（共有）</text><rect x="400" y="202" width="250" height="40" class="tint s"/><text x="525" y="222.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">データ（共有）</text><rect x="400" y="242" width="250" height="60" class="accT s"/><text x="525" y="272.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">テキスト（共有）</text><line x1="448" y1="96" x2="448" y2="172" class="sa" marker-end="url(#a)"/><line x1="528" y1="96" x2="528" y2="172" class="sa" marker-end="url(#a)"/><line x1="608" y1="96" x2="608" y2="172" class="sa" marker-end="url(#a)"/><text x="520" y="322" text-anchor="middle" dominant-baseline="middle" class="t-s">スタックだけが別。ヒープ・データ・テキストは共有</text><text x="520" y="344" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">共有できるのは利点であり、最大の危険でもある</text></svg>
