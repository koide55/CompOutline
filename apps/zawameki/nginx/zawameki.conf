# ざわめき — HTTPS の終端（docker-compose.https.yml の nginx コンテナが読む）
#
#   https://arena.koidelab.net:8100/  →  zawameki コンテナ（8100、平文）
#
# 証明書はホストの /etc/letsencrypt を読み取り専用で借りる。取り方は README の「HTTPS」。
# ドメインを変えるときは server_name と ssl_certificate* の3か所を直す。

upstream zawameki {
    server zawameki:8100;
    keepalive 16;
}

# WebSocket の Upgrade をそのまま渡す（ホストの他の設定と変数名がぶつからないよう接頭辞を付ける）
map $http_upgrade $zawameki_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8100 ssl;
    # [::] は書かない。コンテナには IPv6 が無いことが多く、nginx が起動しなくなる
    # （ホスト側の IPv6 は docker のポート公開が受ける）
    http2 on;
    server_name arena.koidelab.net;

    ssl_certificate     /etc/letsencrypt/live/arena.koidelab.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.koidelab.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:zawameki:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS は付けない。HSTS はポートを区別せずホスト全体に効くので、
    # 同じ arena.koidelab.net の 8000 番（arena、平文）が開けなくなる。

    # http://arena.koidelab.net:8100/ と打った学生を https に送り直す
    # （TLS のポートに平文が来たとき nginx は 497 を出す）
    error_page 497 =301 https://$host:$server_port$request_uri;

    # 学生の投稿は WebSocket の1通（2KB まで）で来る。大きな本文は要らない
    client_max_body_size 64k;

    access_log /var/log/nginx/access.log;

    # 学生・教員・投影の WebSocket（/ws と /ws/teacher）
    location /ws {
        proxy_pass http://zawameki;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zawameki_connection_upgrade;
        # $host ではなく $http_host（ポートつき）を渡す。アプリの CSP がこれで接続先を許す
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 90分の講義のあいだ切らない（アプリは20秒ごとに ping を打つ）
        proxy_read_timeout 3h;
        proxy_send_timeout 3h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://zawameki;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
